<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido recibido</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>

    <header class="banner-encabezado">
        <h1>Cafeteria</h1>
    </header>

    <main class="contenedor-principal resumen">
        <h2>¡Pedido recibido!</h2>
        <p id="mensaje">Gracias por tu pedido.</p>

        <!-- aqui resumen.js escribe los datos del pedido -->
        <ul>
            <li>Correo: <span id="correo"></span></li>
            <li>Producto: <span id="producto"></span></li>
            <li>Cantidad: <span id="cantidad"></span></li>
            <li>Tamaño: <span id="tamano"></span></li>
            <li>Para llevar: <span id="llevar"></span></li>
        </ul>

        <a class="btn-ovalado" href="/">Hacer otro pedido</a>
    </main>

    <script src="JS/resumen.js"></script>
</body>

</html>
